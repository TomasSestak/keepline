name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      # Bun installs deterministically; npm runs each JavaScript tool under the
      # setup-node matrix runtime, which is what the `engines` claim covers.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Kept as separate steps rather than `bun run verify` so a failure names
      # its stage in the Actions UI. Every stage of `verify` must appear here —
      # `check:compiler` was missed once already, which left the React Compiler
      # guard running only at publish time.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:compiler
      - run: npm run test:coverage
      - run: npm run build

      - name: Smoke-test the installed package
        if: matrix.node == 18 || matrix.node == 22
        run: npm run package:smoke

  # The package claims `react >=18`, so the claim gets tested rather than
  # assumed. `useSyncExternalStore` is the only React API the bindings rely on,
  # and it has been stable since 18.0.
  react18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - name: Downgrade to React 18
        run: bun add -d react@^18 react-dom@^18 @types/react@^18 @testing-library/react@^14
      - run: npm run test

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run size
