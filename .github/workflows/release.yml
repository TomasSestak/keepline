name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance — the published package gets a signed,
      # verifiable link back to the commit and workflow that built it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The changesets action runs on Node. No registry auth is configured here
      # on purpose — this job never publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run verify

      # Versioning only. Publishing is `publish.yml`, which authenticates with
      # OIDC — no `publish:` input here, so there is exactly one way for a
      # version to reach npm and no long-lived token in this repository.
      #
      # Flow: merge the version PR this opens, then cut a GitHub release for the
      # new tag; that triggers publish.yml.
      - name: Open or update the version PR
        uses: changesets/action@v1
        with:
          version: bun run changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
