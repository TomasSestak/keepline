name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance — the published package gets a signed,
      # verifiable link back to the commit and workflow that built it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-node stays for two reasons: `changeset publish` shells out to
      # `npm publish` (which reads the registry auth this step writes to
      # ~/.npmrc), and the changesets action itself runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run verify

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run changeset version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance lives here rather than in package.json `publishConfig`,
          # because it requires a CI id-token — as a package field it would make
          # every local `npm publish` fail outright.
          NPM_CONFIG_PROVENANCE: true
